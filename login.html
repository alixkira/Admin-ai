<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>admin𓂀 AI - تسجيل الدخول</title>
  <link rel="manifest" href="manifest.json">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-black: #0a0a0a;
      --bg-card: #141414;
      --red-dark: #8b0000;
      --red-accent: #b22222;
      --text-gray: #a0a0a0;
      --text-light: #ececec;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-light);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 60px 24px 30px;
    }

    /* Logo / Brand Section */
    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }

    .logo-circle {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: radial-gradient(circle at 30% 30%, var(--red-accent), var(--red-dark) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #fff;
      box-shadow: 0 0 40px rgba(139, 0, 0, 0.35);
    }

    .brand-title {
      font-weight: bold;
      font-size: 1.6rem;
      color: var(--text-light);
      letter-spacing: 1px;
    }

    .brand-tagline {
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    /* Auth Actions Section */
    .auth-section {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .google-btn:active {
      background-color: #1c1c1c;
      border-color: var(--red-dark);
    }

    .google-btn i, .google-btn svg {
      font-size: 1.2rem;
    }

    .google-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-gray);
      min-height: 18px;
    }

    .status-msg.error {
      color: var(--red-accent);
    }

    .policy-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-gray);
      line-height: 1.6;
      padding: 0 10px;
    }

    .policy-note a {
      color: var(--text-gray);
      text-decoration: underline;
    }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Brand Section -->
  <div class="brand-section">
    <div class="logo-circle">
      <i class="fa-solid fa-brain"></i>
    </div>
    <div class="brand-title">𝗮𝗱𝗺𝗶𝗻𓂀</div>
    <div class="brand-tagline">سجل الدخول باش تكمل لواجهة الذكاء الاصطناعي</div>
  </div>

  <!-- Auth Section -->
  <div class="auth-section">
    <div class="status-msg" id="statusMsg"></div>

    <button class="google-btn" id="googleBtn">
      <i class="fa-brands fa-google"></i>
      <span>المتابعة باستخدام Google</span>
    </button>

    <div class="policy-note">
      بالمتابعة فإنك توافق على <a href="policy.html">سياسة الخصوصية</a>
    </div>
  </div>

  <script>
    let supabase = null;
    const statusMsg = document.getElementById('statusMsg');
    const googleBtn = document.getElementById('googleBtn');

    function setStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.classList.toggle('error', isError);
    }

    function setLoading(isLoading, label) {
      googleBtn.disabled = isLoading;
      googleBtn.innerHTML = isLoading
        ? `<div class="spinner"></div><span>${label || 'جاري التحقق...'}</span>`
        : `<i class="fa-brands fa-google"></i><span>المتابعة باستخدام Google</span>`;
    }

    // توليد رمز جلسة فريد لكل تسجيل دخول
    function generateSessionId() {
      return 'sess_' + crypto.randomUUID();
    }

    // 1. جلب مفاتيح Supabase من api/Token.js وتفعيل الربط
    async function initSupabase() {
      try {
        const res = await fetch('/api/Token.js');
        const tokens = await res.json();

        if (!tokens.SUPABASE_URL || !tokens.SUPABASE_ANON_KEY) {
          setStatus('تعذر تحميل إعدادات الخادم', true);
          return;
        }

        supabase = window.supabase.createClient(tokens.SUPABASE_URL, tokens.SUPABASE_ANON_KEY);
        checkExistingSession();
      } catch (err) {
        console.error('❌ فشل جلب التوكنات:', err);
        setStatus('تعذر الاتصال بالخادم', true);
      }
    }

    // 2. التحقق إلى كان المستخدم راجع من Google OAuth (فيه جلسة حالية)
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user && session.user.email) {
        setLoading(true, 'جاري التحقق من الحساب...');
        await verifyAndSignIn(session.user);
      }
    }

    // 3. التحقق من واش الإيميل مصرح له (VIP) وتفعيل الجلسة
    async function verifyAndSignIn(user) {
      try {
        const { data: vipRow, error } = await supabase
          .from('vip_users')
          .select('id, email')
          .eq('email', user.email)
          .single();

        if (error || !vipRow) {
          setStatus('هاد الحساب غير مصرح له بالدخول', true);
          setLoading(false);
          await supabase.auth.signOut();
          return;
        }

        // توليد جلسة جديدة وتسجيلها فـ قاعدة البيانات (تطرد أي جهاز قديم)
        const newSessionId = generateSessionId();
        await supabase
          .from('vip_users')
          .update({ active_session_id: newSessionId })
          .eq('id', vipRow.id);

        localStorage.setItem('user_id', vipRow.id);
        localStorage.setItem('session_id', newSessionId);

        setStatus('تم تسجيل الدخول، جاري التوجيه...');
        window.location.href = 'index.html';
      } catch (err) {
        console.error('خطأ فـ التحقق:', err);
        setStatus('وقع خطأ، حاول مرة أخرى', true);
        setLoading(false);
      }
    }

    // 4. الضغط على زر Google
    googleBtn.addEventListener('click', async () => {
      if (!supabase) {
        setStatus('⚠️ الاتصال بـ Supabase ماكملش بعد، جرب تسنى شوية وعاود', true);
        return;
      }
      try {
        setLoading(true, 'جاري التوجيه لـ Google...');
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.href }
        });
        if (error) {
          setStatus('⚠️ خطأ: ' + error.message, true);
          setLoading(false);
        }
      } catch (err) {
        setStatus('⚠️ خطأ غير متوقع: ' + err.message, true);
        setLoading(false);
      }
    });

    window.addEventListener('DOMContentLoaded', initSupabase);
  </script>
</body>
</html>
