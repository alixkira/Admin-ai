<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>admin𓂀 AI</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-black: #0a0a0a;
      --bg-card: #141414;
      --red-dark: #8b0000;
      --red-accent: #b22222;
      --text-gray: #a0a0a0;
      --text-light: #ececec;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-light);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-black);
      z-index: 10;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .brand-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--text-light);
      letter-spacing: 1px;
    }

    /* Sidebar Drawer (Swipe Menu) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100%;
      background-color: var(--bg-card);
      border-left: 1px solid var(--border-color);
      z-index: 101;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    .drawer-overlay.active .sidebar {
      transform: translateX(-280px);
    }

    .new-chat-btn {
      background-color: var(--red-dark);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .chats-header {
      color: var(--text-gray);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .conv-item {
      position: relative;
      padding: 10px 34px 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s;
    }

    .conv-item:hover {
      background-color: #1a1a1a;
    }

    /* المحادثة المفتوحة حاليا */
    .conv-item.active {
      background-color: rgba(178, 34, 34, 0.25);
    }

    .conv-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .conv-dots {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-gray);
      padding: 4px 8px;
      cursor: pointer;
      display: none;
      border-radius: 6px;
    }

    @media (hover: hover) {
      .conv-item:hover .conv-dots {
        display: block;
      }
    }
    .conv-item.menu-open .conv-dots {
      display: block;
    }

    .conv-menu {
      position: absolute;
      right: 6px;
      top: calc(100% + 2px);
      background-color: #1c1c1c;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      z-index: 200;
      min-width: 150px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    .conv-menu-item {
      padding: 10px 14px;
      font-size: 0.82rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .conv-menu-item:hover {
      background-color: #2a2a2a;
    }

    .conv-menu-item.danger {
      color: var(--red-accent);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
      margin-top: 10px;
    }

    .settings-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-light);
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background-color: var(--red-dark);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Main Chat Container */
    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    /* Borderless Chat UI: no bubble background/border, plain aligned text blocks */
    .message {
      max-width: 90%;
      padding: 6px 2px;
      background: transparent;
      border: none;
      border-radius: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      position: relative;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      color: var(--red-accent);
      text-align: right;
    }

    .message.ai {
      align-self: flex-start;
      color: var(--text-light);
      text-align: right;
      width: 100%;
    }

    /* كل سطر (عربي/أجنبي) فبلاصتو، الاتجاه كيتحسب لكل سطر بروحو */
    .msg-line {
      unicode-bidi: plaintext;
      display: block;
    }
    .msg-line:not(:last-child) {
      margin-bottom: 4px;
    }

    .message-actions {
      display: none;
      gap: 10px;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    /* رسائل AI: زر النسخ ظاهر دايما */
    .message.ai .message-actions {
      display: flex;
    }

    /* رسائل المستخدم: زر النسخ مخبي، يبان بـ hover (حاسوب) أو ضغط مطول (هاتف) */
    @media (hover: hover) {
      .message.user:hover .message-actions {
        display: flex;
      }
    }
    .message.user.show-actions .message-actions {
      display: flex;
    }

    .action-icon {
      cursor: pointer;
      color: var(--text-gray);
      font-size: 0.95rem;
    }

    /* الشاشة الفارغة (بلا محادثة) */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 20px;
    }

    .empty-state-title {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, var(--text-light), var(--red-accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    .suggestion-chips {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .suggestion-chip {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .suggestion-chip:active {
      border-color: var(--red-accent);
    }

    .suggestion-chip i {
      color: var(--red-accent);
    }

    /* Input Bar */
    .input-container {
      padding: 12px 16px;
      background-color: var(--bg-black);
      border-top: 1px solid var(--border-color);
    }

    .input-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      gap: 8px;
    }

    .input-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-light);
      padding: 8px;
      font-size: 0.95rem;
    }

    .attachment-preview {
      padding: 8px 4px;
    }

    .attachment-thumb-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      display: inline-block;
    }

    .attachment-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .attachment-thumb-wrap button {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--red-dark);
      color: #fff;
      border: none;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .msg-image {
      max-width: 220px;
      border-radius: 12px;
      display: block;
      margin-bottom: 6px;
    }

    .input-btn {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      transition: color 0.2s;
    }

    .input-btn:active {
      color: var(--red-accent);
    }

    .input-btn.call-btn {
      color: var(--red-accent);
    }

    /* Popup Action Selector (+ Button) */
    .action-modal {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      z-index: 90;
      transition: bottom 0.3s ease;
    }

    .action-modal.active {
      bottom: 0;
    }

    .action-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 89;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .action-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .action-modal-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .action-modal-close {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: var(--text-light);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      text-align: center;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-light);
      cursor: pointer;
    }

    .action-item i {
      width: 48px;
      height: 48px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--red-accent);
    }

    /* Live Voice Overlay UI */
    .voice-call-overlay {
      position: fixed;
      inset: 0;
      background-color: var(--bg-black);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .voice-call-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .voice-status {
      font-size: 1.1rem;
      color: var(--text-gray);
      text-align: center;
    }

    .voice-wave {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--red-dark) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }

    .voice-controls {
      display: flex;
      gap: 30px;
    }

    .call-ctl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      font-size: 1.3rem;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .call-hold { background-color: #333; }
    .call-end { background-color: var(--red-dark); }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <button class="menu-btn" id="openDrawer"><i class="fa-solid fa-bars"></i></button>
    <div class="brand-title">𝗮𝗱𝗺𝗶𝗻𓂀</div>
    <a href="message.html" style="color: var(--text-light); text-decoration: none; position: relative;">
      <i class="fa-regular fa-bell"></i>
      <span id="notifBadge" style="position: absolute; top: -5px; right: -5px; background: var(--red-dark); color: white; font-size: 0.65rem; width: 15px; height: 15px; border-radius: 50%; display: none; align-items: center; justify-content: center;">1</span>
    </a>
  </header>

  <!-- Sidebar / Drawer (Swipe supported) -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="newChatBtn">
        <i class="fa-solid fa-plus"></i> دردشة جديدة
      </button>

      <div class="chats-header">الدردشات الأخيرة</div>
      <div class="chats-list" id="chatsList">
        <!-- Dynamically Populated Conversations -->
      </div>

      <div class="sidebar-footer">
        <a href="Preparations.html" class="settings-link">
          <div class="user-avatar" id="userInitial">U</div>
          <div style="flex: 1;">
            <div style="font-size: 0.9rem; font-weight: bold;">الإعدادات</div>
            <div style="font-size: 0.75rem; color: var(--text-gray);" id="userEmailDisplay">جاري التحميل...</div>
          </div>
          <i class="fa-solid fa-gear" style="color: var(--text-gray);"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Main Messages Container -->
  <main id="chatContainer">
    <div class="empty-state" id="emptyState">
      <div class="empty-state-title">مرحباً، ابدأ دردشة بلا حدود</div>
      <div class="suggestion-chips">
        <div class="suggestion-chip" data-prompt="عرفني بنفسك">
          <i class="fa-solid fa-user"></i> عرفني بنفسك
        </div>
        <div class="suggestion-chip" data-prompt="أنشئ صورة">
          <i class="fa-solid fa-image"></i> أنشئ صورة
        </div>
      </div>
    </div>
    <div id="messagesWrapper" style="display:flex; flex-direction:column; gap:4px;"></div>
  </main>

  <!-- Bottom Input Bar -->
  <div class="input-container">
    <div id="attachmentPreview" class="attachment-preview" style="display:none;">
      <div class="attachment-thumb-wrap">
        <img id="attachmentThumb" src="" alt="صورة مرفقة" />
        <button id="removeAttachment"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="input-box">
      <button class="input-btn" id="toggleActions"><i class="fa-solid fa-paperclip"></i></button>
      <input type="text" id="userInput" placeholder="إسأل 𝗮𝗱𝗺𝗶𝗻𓂀..." />
      <button class="input-btn" id="sttBtn" title="تحويل الصوت لنص"><i class="fa-solid fa-microphone"></i></button>
      <button class="input-btn call-btn" id="dynamicActionBtn" title="مكالمة صوتية"><i class="fa-solid fa-phone" id="dynamicActionIcon"></i></button>
    </div>
  </div>

  <!-- Attachment Options Drawer Modal -->
  <div class="action-modal-backdrop" id="actionModalBackdrop"></div>
  <div class="action-modal" id="actionModal">
    <div class="action-modal-header">
      <span></span>
      <button class="action-modal-close" id="closeActionModal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="action-grid">
      <div class="action-item" onclick="triggerFileInput('camera')">
        <i class="fa-solid fa-camera"></i>
        <span>الكاميرا</span>
      </div>
      <div class="action-item" onclick="triggerFileInput('gallery')">
        <i class="fa-solid fa-image"></i>
        <span>الصور</span>
      </div>
      <div class="action-item" onclick="triggerFileInput('file')">
        <i class="fa-solid fa-file"></i>
        <span>الملفات</span>
      </div>
    </div>
    <input type="file" id="hiddenFileInput" style="display: none;" />
  </div>

  <!-- Live Voice Interface Modal -->
  <div class="voice-call-overlay" id="voiceOverlay">
    <div class="voice-status" id="callStatus">جاري الاتصال بـ 𝗮𝗱𝗺𝗶𝗻𓂀...</div>
    <div class="voice-wave">
      <i class="fa-solid fa-brain" style="font-size: 2.5rem; color: #fff;"></i>
    </div>
    <div class="voice-controls">
      <button class="call-ctl-btn call-hold" id="pauseCallBtn"><i class="fa-solid fa-pause"></i></button>
      <button class="call-ctl-btn call-end" id="endCallBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <!-- Main Javascript Execution -->
  <script>
    // 1. التأكد من تسجيل الدخول
    const currentUserId = localStorage.getItem('user_id');
    if (!currentUserId) {
      window.location.href = 'login.html';
    }

    const chatContainer = document.getElementById('messagesWrapper');
    const chatScrollEl = document.getElementById('chatContainer');
    const emptyState = document.getElementById('emptyState');

    function toggleEmptyState() {
      const hasMessages = chatContainer.children.length > 0;
      emptyState.style.display = hasMessages ? 'none' : 'flex';
    }

    // شرائح الاقتراح فالشاشة الفارغة: كتعمر خانة الكتابة بالنص
    document.querySelectorAll('.suggestion-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const inputEl = document.getElementById('userInput');
        inputEl.value = chip.dataset.prompt;
        inputEl.focus();
        if (typeof updateDynamicActionBtn === 'function') updateDynamicActionBtn();
      });
    });

    // 2. الربط التلقائي بـ Supabase عبر api/Token.js
    // ⚠️ سميناه sbClient (ماشي supabase) حيت "supabase" مستعمل من قبل
    // مكتبة Supabase نفسها (window.supabase) وكيوقع تعارض (SyntaxError)
    // كيوقف تنفيذ الصفحة كاملة إلى سميناه بنفس الإسم.
    let sbClient = null;

    async function initSupabase() {
      try {
        const res = await fetch('/api/Token.js');
        const tokens = await res.json();

        if (tokens.SUPABASE_URL && tokens.SUPABASE_ANON_KEY) {
          sbClient = window.supabase.createClient(tokens.SUPABASE_URL, tokens.SUPABASE_ANON_KEY);
          console.log('✅ تم الربط بـ Supabase بنجاح عبر Token.js');
          loadUserData();
        } else {
          console.error('❌ المفاتيح ناقصة فـ Vercel');
        }
      } catch (err) {
        console.error('❌ فشل جلب التوكنات:', err);
      }
    }

    // جلب بيانات المستخدم من vip_users
    async function loadUserData() {
      if (!sbClient || !currentUserId) return;
      
      try {
        const { data, error } = await sbClient
          .from('vip_users')
          .select('email')
          .eq('id', currentUserId)
          .single();

        if (data && data.email) {
          document.getElementById('userEmailDisplay').textContent = data.email;
          document.getElementById('userInitial').textContent = data.email.charAt(0).toUpperCase();
        }

        // نجيبو لائحة المحادثات، ونحملو آخر محادثة كانت مفتوحة (إلى كانت)
        await loadConversationsList();
        if (currentConversationId) {
          switchConversation(currentConversationId);
        } else {
          toggleEmptyState();
        }
      } catch (e) {
        console.error('خطأ فـ تحميل بيانات البروفايل:', e);
      }
    }

    // تشغيل الربط فور فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      checkNewMessages();
    });

    // 2b. التحقق من وجود جديد فـ message.html وإظهار البادج فقط إلى كاين شي حاجة جديدة
    function checkNewMessages() {
      const notifBadge = document.getElementById('notifBadge');
      // العلم كيتسجل من صفحة message.html نفسها (localStorage: hasNewMessage = 'true')
      const hasNewMessage = localStorage.getItem('hasNewMessage') === 'true';
      notifBadge.style.display = hasNewMessage ? 'flex' : 'none';
    }

    // 2c. متغير المحادثة الحالية (null = محادثة جديدة لسه ماتخلقاتش)
    let currentConversationId = localStorage.getItem('current_conversation_id') || null;

    // جلب لائحة المحادثات وعرضها فـ القائمة الجانبية
    async function loadConversationsList() {
      if (!sbClient || !currentUserId) return;
      const chatsListEl = document.getElementById('chatsList');

      try {
        const { data: convs, error } = await sbClient
          .from('conversations')
          .select('id, title, pinned, updated_at')
          .eq('user_id', currentUserId)
          .order('pinned', { ascending: false })
          .order('updated_at', { ascending: false });

        if (error || !convs) {
          chatsListEl.innerHTML = '';
          return;
        }

        chatsListEl.innerHTML = '';
        convs.forEach((conv) => {
          const item = document.createElement('div');
          item.className = 'conv-item' + (conv.id === currentConversationId ? ' active' : '');
          item.dataset.convId = conv.id;

          const titleSpan = document.createElement('span');
          titleSpan.className = 'conv-title';
          titleSpan.innerHTML = (conv.pinned ? '<i class="fa-solid fa-thumbtack" style="font-size:0.7rem;color:var(--red-accent);"></i> ' : '') + conv.title;

          const dotsBtn = document.createElement('button');
          dotsBtn.className = 'conv-dots';
          dotsBtn.innerHTML = '<i class="fa-solid fa-ellipsis-vertical"></i>';
          dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openConvMenu(item, conv);
          });

          item.appendChild(titleSpan);
          item.appendChild(dotsBtn);

          let suppressNextClick = false;
          item.addEventListener('click', (e) => {
            if (suppressNextClick) {
              suppressNextClick = false;
              e.stopPropagation();
              return;
            }
            switchConversation(conv.id);
          });

          // ضغط مطول فالهاتف كيحل نفس القائمة
          let longPressTimer = null;
          item.addEventListener('touchstart', () => {
            longPressTimer = setTimeout(() => {
              openConvMenu(item, conv);
              suppressNextClick = true;
              longPressTimer = null;
            }, 500);
          });
          item.addEventListener('touchend', () => {
            if (longPressTimer) clearTimeout(longPressTimer);
          });
          item.addEventListener('touchmove', () => {
            if (longPressTimer) clearTimeout(longPressTimer);
          });

          chatsListEl.appendChild(item);
        });
      } catch (e) {
        console.error('خطأ فـ جلب المحادثات:', e);
      }
    }

    // فتح قائمة (تثبيت/إلغاء تثبيت - إعادة تسمية - حذف) لمحادثة معينة
    function openConvMenu(item, conv) {
      // نحيدو أي قائمة مفتوحة قبل
      document.querySelectorAll('.conv-menu').forEach((m) => m.remove());
      document.querySelectorAll('.conv-item.menu-open').forEach((el) => el.classList.remove('menu-open'));

      item.classList.add('menu-open');

      const menu = document.createElement('div');
      menu.className = 'conv-menu';
      menu.innerHTML = `
        <div class="conv-menu-item" data-action="pin">
          <i class="fa-solid fa-thumbtack"></i> ${conv.pinned ? 'إلغاء تثبيت' : 'تثبيت'}
        </div>
        <div class="conv-menu-item" data-action="rename">
          <i class="fa-solid fa-pen"></i> إعادة تسمية
        </div>
        <div class="conv-menu-item danger" data-action="delete">
          <i class="fa-solid fa-trash"></i> حذف
        </div>
      `;
      item.appendChild(menu);

      menu.addEventListener('click', async (e) => {
        e.stopPropagation();
        const action = e.target.closest('.conv-menu-item')?.dataset.action;
        if (!action) return;

        if (action === 'pin') {
          await sbClient.from('conversations').update({ pinned: !conv.pinned }).eq('id', conv.id);
          loadConversationsList();
        } else if (action === 'rename') {
          const newTitle = prompt('إسم المحادثة الجديد:', conv.title);
          if (newTitle && newTitle.trim()) {
            await sbClient.from('conversations').update({ title: newTitle.trim() }).eq('id', conv.id);
            loadConversationsList();
          }
        } else if (action === 'delete') {
          const confirmed = confirm('هل أنت متأكد؟ حذف المحادثة نهائي ولا يمكن التراجع عنه.');
          if (confirmed) {
            await sbClient.from('conversations').delete().eq('id', conv.id);
            if (conv.id === currentConversationId) {
              currentConversationId = null;
              localStorage.removeItem('current_conversation_id');
              chatContainer.innerHTML = '';
              toggleEmptyState();
            }
            loadConversationsList();
          }
        }
        item.classList.remove('menu-open');
      });

      // نسد القائمة إلى ضغط المستخدم فأي بلاصة أخرى
      setTimeout(() => {
        document.addEventListener('click', function closeMenu() {
          menu.remove();
          item.classList.remove('menu-open');
          document.removeEventListener('click', closeMenu);
        }, { once: true });
      }, 0);
    }

    // تحميل رسائل محادثة معينة فالشاشة
    async function switchConversation(convId) {
      currentConversationId = convId;
      localStorage.setItem('current_conversation_id', convId);
      drawerOverlay.classList.remove('active');

      chatContainer.innerHTML = '';
      try {
        const { data: messages } = await sbClient
          .from('chat_messages')
          .select('sender, message')
          .eq('conversation_id', convId)
          .order('created_at', { ascending: true });

        if (messages && messages.length > 0) {
          messages.forEach((m) => appendMessage(m.message, m.sender));
        }
        toggleEmptyState();
      } catch (e) {
        console.error('خطأ فـ تحميل الرسائل:', e);
      }
    }

    // زر "دردشة جديدة"
    document.getElementById('newChatBtn').addEventListener('click', () => {
      currentConversationId = null;
      localStorage.removeItem('current_conversation_id');
      chatContainer.innerHTML = '';
      toggleEmptyState();
      drawerOverlay.classList.remove('active');
    });

    // 3. التحكم فـ القائمة الجانبية والإيماءات (Swipe)
    const drawerOverlay = document.getElementById('drawerOverlay');
    const openDrawer = document.getElementById('openDrawer');

    openDrawer.addEventListener('click', () => {
      drawerOverlay.classList.add('active');
      loadConversationsList();
    });
    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) drawerOverlay.classList.remove('active');
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].clientX;
      if (touchStartX - touchEndX > 70) drawerOverlay.classList.remove('active'); // سحب لليسار للإغلاق
      if (touchEndX - touchStartX > 70 && touchStartX < 40) drawerOverlay.classList.add('active'); // سحب لليمين للفتح
    });

    // 4. نافذة المرفقات (+ Button)
    const actionModal = document.getElementById('actionModal');
    const actionModalBackdrop = document.getElementById('actionModalBackdrop');

    function openActionModal() {
      actionModal.classList.add('active');
      actionModalBackdrop.classList.add('active');
    }

    function closeActionModal() {
      actionModal.classList.remove('active');
      actionModalBackdrop.classList.remove('active');
    }

    document.getElementById('toggleActions').addEventListener('click', () => {
      if (actionModal.classList.contains('active')) {
        closeActionModal();
      } else {
        openActionModal();
      }
    });

    document.getElementById('closeActionModal').addEventListener('click', closeActionModal);
    actionModalBackdrop.addEventListener('click', closeActionModal);

    function triggerFileInput(type) {
      const fileInput = document.getElementById('hiddenFileInput');
      if (type === 'camera') fileInput.setAttribute('capture', 'environment');
      else fileInput.removeAttribute('capture');
      fileInput.accept = 'image/*';
      fileInput.click();
      closeActionModal();
    }

    // 4b. قراءة الصورة المختارة وعرضها كمعاينة قبل الإرسال
    let pendingImage = null; // { mimeType, base64Data, dataUrl }
    const attachmentPreview = document.getElementById('attachmentPreview');
    const attachmentThumb = document.getElementById('attachmentThumb');

    document.getElementById('hiddenFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('حاليا مدعومة غير الصور فقط');
        e.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const base64Data = dataUrl.split(',')[1];
        pendingImage = { mimeType: file.type, base64Data, dataUrl };
        attachmentThumb.src = dataUrl;
        attachmentPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('removeAttachment').addEventListener('click', () => {
      pendingImage = null;
      attachmentPreview.style.display = 'none';
    });

    // 5. تحويل الصوت لنص (Microphone Button)
    const sttBtn = document.getElementById('sttBtn');
    const userInput = document.getElementById('userInput');
    
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';

      sttBtn.addEventListener('click', () => {
        recognition.start();
        sttBtn.style.color = 'var(--red-dark)';
      });

      recognition.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
        sttBtn.style.color = 'var(--text-gray)';
        updateDynamicActionBtn();
      };

      recognition.onerror = () => sttBtn.style.color = 'var(--text-gray)';
    }

    // 6. واجهة المكالمة الصوتية المباشرة (Live Voice UI)
    const voiceOverlay = document.getElementById('voiceOverlay');
    document.getElementById('endCallBtn').addEventListener('click', () => voiceOverlay.classList.remove('active'));

    // 6b. الزر الديناميكي: هاتف (لما الرسالة فارغة) / إرسال (لما كاين نص مكتوب)
    const dynamicActionBtn = document.getElementById('dynamicActionBtn');
    const dynamicActionIcon = document.getElementById('dynamicActionIcon');

    function updateDynamicActionBtn() {
      const hasContent = userInput.value.trim().length > 0 || pendingImage !== null;
      if (hasContent) {
        dynamicActionIcon.className = 'fa-solid fa-paper-plane';
        dynamicActionBtn.title = 'إرسال';
        dynamicActionBtn.classList.remove('call-btn');
        dynamicActionBtn.style.color = 'var(--red-accent)';
      } else {
        dynamicActionIcon.className = 'fa-solid fa-phone';
        dynamicActionBtn.title = 'مكالمة صوتية';
        dynamicActionBtn.classList.add('call-btn');
        dynamicActionBtn.style.color = '';
      }
    }

    userInput.addEventListener('input', updateDynamicActionBtn);

    dynamicActionBtn.addEventListener('click', () => {
      const hasContent = userInput.value.trim().length > 0 || pendingImage !== null;
      if (hasContent) {
        sendMessage();
      } else {
        voiceOverlay.classList.add('active');
      }
    });

    // نرسل الرسالة كذلك عند الضغط على Enter
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (userInput.value.trim().length > 0 || pendingImage !== null)) {
        sendMessage();
      }
    });

    // 7. إضافة الرسائل للواجهة
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function appendMessage(text, sender, imageDataUrl) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;

      // كل سطر (عربي/أجنبي) كيتلف فـ div ديالو، الاتجاه كيتحسب لكل سطر بروحو
      const linesHtml = (text || '')
        .split('\n')
        .filter((line) => line.length > 0)
        .map((line) => `<div class="msg-line" dir="auto">${escapeHtml(line)}</div>`)
        .join('');

      const imageHtml = imageDataUrl
        ? `<img class="msg-image" src="${imageDataUrl}" alt="صورة مرفقة" />`
        : '';

      msgDiv.innerHTML = `
        <div class="msg-text">${imageHtml}${linesHtml}</div>
        <div class="message-actions">
          <span class="action-icon"><i class="fa-regular fa-copy"></i></span>
        </div>
      `;

      msgDiv.querySelector('.action-icon').addEventListener('click', () => {
        navigator.clipboard.writeText(text || '');
      });

      // بنسبة لرسائل المستخدم: ضغط مطول (هاتف) كيبين زر النسخ
      if (sender === 'user') {
        let longPressTimer = null;
        msgDiv.addEventListener('touchstart', () => {
          longPressTimer = setTimeout(() => {
            msgDiv.classList.add('show-actions');
          }, 450);
        });
        msgDiv.addEventListener('touchend', () => {
          if (longPressTimer) clearTimeout(longPressTimer);
        });
        msgDiv.addEventListener('touchmove', () => {
          if (longPressTimer) clearTimeout(longPressTimer);
        });
      }

      chatContainer.appendChild(msgDiv);
      chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
      toggleEmptyState();
    }

    // مؤشر "جاري البحث" أثناء انتظار جواب الـ AI
    const loadingPhrases = [
      'جاري البحث...',
      'جاري التفكير...',
      'جاري تحليل السؤال...',
      'جاري صياغة الجواب...',
      'جاري تحميل النتيجة...'
    ];
    let loadingInterval = null;

    function showTypingIndicator() {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ai';
      msgDiv.id = 'typingIndicator';
      msgDiv.innerHTML = `<div class="msg-text"><div class="msg-line" dir="auto">${loadingPhrases[0]}</div></div>`;
      chatContainer.appendChild(msgDiv);
      chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
      toggleEmptyState();

      let i = 0;
      loadingInterval = setInterval(() => {
        i = (i + 1) % loadingPhrases.length;
        const lineEl = msgDiv.querySelector('.msg-line');
        if (lineEl) lineEl.textContent = loadingPhrases[i];
      }, 1300);
    }

    function removeTypingIndicator() {
      if (loadingInterval) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // 8. إرسال الرسالة لـ api/Chat.bot
    async function sendMessage() {
      const text = userInput.value.trim();
      const imageToSend = pendingImage;
      if (!text && !imageToSend) return;

      appendMessage(text, 'user', imageToSend ? imageToSend.dataUrl : null);
      userInput.value = '';
      pendingImage = null;
      attachmentPreview.style.display = 'none';
      updateDynamicActionBtn();
      showTypingIndicator();

      try {
        const response = await fetch('/api/Chat.bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userPrompt: text,
            user_id: currentUserId,
            conversation_id: currentConversationId,
            image: imageToSend ? { mimeType: imageToSend.mimeType, data: imageToSend.base64Data } : null
          })
        });
        const data = await response.json();
        removeTypingIndicator();

        if (data.conversation_id && data.conversation_id !== currentConversationId) {
          currentConversationId = data.conversation_id;
          localStorage.setItem('current_conversation_id', currentConversationId);
          loadConversationsList();
        }

        if (data.text) {
          appendMessage(data.text, 'ai');
          if (data.warning) {
            appendMessage(data.warning, 'ai');
          }
        } else {
          // كنبينو الخطأ الحقيقي مباشرة فالشات بلا ما نحتاجو Developer Tools
          appendMessage('⚠️ خطأ من السيرفر (status ' + response.status + '): ' + (data.error || 'بلا تفاصيل'), 'ai');
        }
      } catch (err) {
        removeTypingIndicator();
        appendMessage('⚠️ تعذر الاتصال بالسيرفر: ' + err.message, 'ai');
      }
    }
  </script>
</body>
</html>
